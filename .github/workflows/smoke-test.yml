name: Smoke Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Three runs a night, at 07:13, 07:33 and 07:53 UTC, to catch flaky tests.
    - cron: "13,33,53 7 * * *"
  push:
    branches:
      - "release-branch/*"
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build Docker build image
        run: make docker-build-image

      - name: Build debug APK
        run: make docker-tailscale-debug

      - name: Build Docker test image
        run: make docker-build-android-integration-image

      - name: Run smoke test
        env:
          TS_TESTWRAPPER_RESULTS_SUMMARY: "1"
        shell: bash
        run: make android-smoke-test-run 2>&1 | tee "smoke-test-${GITHUB_RUN_ATTEMPT}.log"

      - name: Make test artifacts readable
        if: always()
        continue-on-error: true
        run: test ! -d integration-artifacts || sudo chmod -R a+rX integration-artifacts

      - name: Upload test artifacts
        id: artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-artifacts-${{ github.run_attempt }}
          path: integration-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test results
        id: report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/android-test-report
        with:
          check: smoke-test
          all-recordings-url: ${{ steps.artifacts.outputs.artifact-url }}

  notify:
    needs: smoke-test
    if: always() && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Post results to Slack
        uses: ./.github/actions/android-slack-notify
        with:
          webhook: ${{ secrets.ANDROID_SLACK_WEBHOOK_URL }}
          result: ${{ needs.smoke-test.result }}
          report: ${{ needs.smoke-test.outputs.report }}
          combine: ${{ github.event_name == 'pull_request' }}
