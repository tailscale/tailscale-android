name: Smoke Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Three runs a night, at 07:13, 07:33 and 07:53 UTC, to catch flaky tests.
    - cron: "13,33,53 7 * * *"
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build Docker build image
        run: make docker-build-image

      - name: Build debug APK
        run: make docker-tailscale-debug

      - name: Build Docker test image
        run: make docker-build-android-integration-image

      - name: Run smoke test
        env:
          TS_TESTWRAPPER_RESULTS_SUMMARY: "1"
        run: make android-smoke-test-run

      - name: Add test results to the summary
        if: always()
        continue-on-error: true
        run: test ! -f android-test-summary.md || cat android-test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Make test artifacts readable
        if: always()
        continue-on-error: true
        run: test ! -d integration-artifacts || sudo chmod -R a+rX integration-artifacts

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-artifacts-${{ github.run_attempt }}
          path: integration-artifacts/
          if-no-files-found: ignore
          retention-days: 14
