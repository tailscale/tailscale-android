name: android-slack-notify
description: Post Android test results to Slack, with the failed cases' recordings and the job logs up front

inputs:
  webhook:
    description: Slack incoming webhook URL. Nothing is posted when it's empty
    required: false
    default: ""
  result:
    description: Result of this workflow's test job
    required: true
  report:
    description: The report output of android-test-report, if this workflow has one
    required: false
    default: ""
  combine:
    description: On a PR's first attempt, wait for the other two checks and post one message for all three
    required: false
    default: "false"
  wait-minutes:
    description: How long to wait for the other checks before posting
    required: false
    default: "30"
  timeout-minutes:
    description: The test job's timeout-minutes, so a cancel at the limit reads as a timeout
    required: false
    default: "90"
  github-token:
    description: Token for reading jobs, job logs and the other checks' reports
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Look up this job
      id: self
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        HAS_WEBHOOK: ${{ inputs.webhook != '' }}
        RESULT: ${{ inputs.result }}
        TIMEOUT: ${{ inputs.timeout-minutes }}
        COMBINE: ${{ inputs.combine }}
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          await require("./.github/actions/android-slack-notify/notify.js").self({ github, context, core, exec });

    - name: Wait for the other checks
      id: wait
      if: steps.self.outputs.send == 'true' && steps.self.outputs.mode != 'single'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SELF_SLUG: ${{ steps.self.outputs.slug }}
        MODE: ${{ steps.self.outputs.mode }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        POLL_SECONDS: "60"
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          await require("./.github/actions/android-slack-notify/notify.js").wait({ github, context, core, exec });

    - name: Download the Smoke Test report
      if: steps.wait.outputs.smoke_ran == 'true'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: smoke-test-report-*
        run-id: ${{ steps.wait.outputs.smoke_run_id }}
        github-token: ${{ inputs.github-token }}
        path: other-reports/smoke-test

    - name: Download the Integration Test report
      if: steps.wait.outputs.integration_ran == 'true'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: integration-test-report-*
        run-id: ${{ steps.wait.outputs.integration_run_id }}
        github-token: ${{ inputs.github-token }}
        path: other-reports/integration-test

    - name: Fetch job logs
      id: logs
      if: steps.self.outputs.send == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        MODE: ${{ steps.self.outputs.mode }}
        SELF_SLUG: ${{ steps.self.outputs.slug }}
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          await require("./.github/actions/android-slack-notify/notify.js").logs({ github, context, core, exec });

    - name: Upload the Android CI log
      id: android-ci-log
      if: steps.logs.outputs.android_ci != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ steps.logs.outputs.android_ci }}
        archive: false
        retention-days: 14

    - name: Upload the Smoke Test log
      id: smoke-test-log
      if: steps.logs.outputs.smoke_test != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ steps.logs.outputs.smoke_test }}
        archive: false
        retention-days: 14

    - name: Upload the Integration Test log
      id: integration-test-log
      if: steps.logs.outputs.integration_test != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ steps.logs.outputs.integration_test }}
        archive: false
        retention-days: 14

    - name: Build Slack payload
      id: payload
      if: steps.self.outputs.send == 'true'
      shell: bash
      env:
        MODE: ${{ steps.self.outputs.mode }}
        REPORT: ${{ inputs.report }}
        LOG_ANDROID_CI: ${{ steps.android-ci-log.outputs.artifact-url }}
        LOG_SMOKE_TEST: ${{ steps.smoke-test-log.outputs.artifact-url }}
        LOG_INTEGRATION_TEST: ${{ steps.integration-test-log.outputs.artifact-url }}
        EVENT: ${{ github.event_name }}
        PR_ACTION: ${{ github.event.action }}
        REF_NAME: ${{ github.ref_name }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # PR fields can come from a fork, so they only reach the script through env.
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"$REPORT"; then
          REPORT='{}'
        fi
        others='{}'
        if [ -s "$RUNNER_TEMP/android-others.json" ]; then
          others=$(cat "$RUNNER_TEMP/android-others.json")
        fi
        # Each attempt uploads its own report, so take the newest.
        reports='{}'
        for slug in smoke-test integration-test; do
          found=$(find "other-reports/$slug" -name "$slug-report.json" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$found" ] && jq -e 'type == "object"' "$found" >/dev/null 2>&1; then
            reports=$(jq -c --arg s "$slug" --slurpfile r "$found" '. + {($s): $r[0]}' <<<"$reports")
          fi
        done
        logs=$(jq -n -c --arg a "$LOG_ANDROID_CI" --arg s "$LOG_SMOKE_TEST" --arg i "$LOG_INTEGRATION_TEST" \
          '{"android-ci": $a, "smoke-test": $s, "integration-test": $i}')

        jq -n -L "$GITHUB_ACTION_PATH" --slurpfile self "$RUNNER_TEMP/android-self.json" \
          --argjson report "$REPORT" --argjson others "$others" --argjson reports "$reports" --argjson logs "$logs" \
          --arg mode "$MODE" --arg event "$EVENT" --arg pr_action "$PR_ACTION" --arg ref "$REF_NAME" \
          --arg run_attempt "$RUN_ATTEMPT" --arg run_id "$RUN_ID" --arg repo_url "$REPO_URL" --arg pr_number "$PR_NUMBER" \
          --arg pr_title "$PR_TITLE" --arg pr_url "$PR_URL" --arg pr_branch "$PR_BRANCH" --arg sha "$HEAD_SHA" \
          --arg tick "'" 'include "message";
          ($self[0] + {report: $report, log_url: $logs[$self[0].slug]}) as $me
          | {self: $me,
             others: ($others | with_entries(.value += {report: ($reports[.key] // {}), log_url: $logs[.key]})),
             event: $event, pr_action: $pr_action, ref: $ref, run_attempt: $run_attempt, run_id: $run_id, repo_url: $repo_url,
             pr_number: $pr_number, pr_title: $pr_title, pr_url: $pr_url, pr_branch: $pr_branch, sha: $sha, tick: $tick}
          | message($mode)' > payload.json

    - name: Send to Slack
      if: inputs.webhook != '' && steps.self.outputs.send == 'true'
      continue-on-error: true
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload-file-path: payload.json
