[versions]
accompanist = "0.34.0"
coroutines = "1.8.1"
navigation = "2.8.5"
core = "1.13.1"
compose-bom = "2024.09.03"
kotlin = "1.9.22"
work = "2.9.1"
browser = "1.8.0"
security-crypto = "1.1.0-alpha06"
serialization = "1.6.3"
junit = "4.13.2"
room = "2.6.1"
compose = "1.7.3"
material3 = "1.3.0"
lifecycle = "2.8.6"
activity = "1.9.2"
splashscreen = "1.1.0-rc01"
animation = "1.7.4"
coil = "2.6.0"
zxing = "3.5.1"
vico = "1.15.0"
androidx-test = "1.6.2"
androidx-test-ext = "1.2.1"
espresso = "3.6.1"
uiautomator = "2.3.0"
onetimepassword = "2.4.0"
commons-codec = "1.16.1"
mockito-core = "5.12.0"
mockito-inline = "5.2.0"
mockito-kotlin = "5.4.0"

[libraries]
# Android dependencies
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-coreKtx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-work-runtimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Kotlin dependencies
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Compose dependencies
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-animation = { module = "androidx.compose.animation:animation", version.ref = "animation" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }

# Navigation dependencies
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Supporting libraries
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-composeM3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# Integration Tests
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-ext-junitKtx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-ext" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# Authentication only for tests
kotlin-onetimepassword = { module = "dev.turingcomplete:kotlin-onetimepassword", version.ref = "onetimepassword" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }

# Unit Tests
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito-inline" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }





