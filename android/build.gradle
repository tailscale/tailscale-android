buildscript {
    ext.kotlin_version = "1.9.22"
    ext.compose_version = "1.5.10"

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath("com.ncorti.ktfmt.gradle:plugin:0.17.0")
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

apply plugin: 'kotlin-android'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.ncorti.ktfmt.gradle'

android {
    def androidApiLevel = providers.gradleProperty("androidApiLevel").get().toInteger()

    ndkVersion "23.1.7779620"
    compileSdkVersion androidApiLevel
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion androidApiLevel

        // VERSION_CODE_BASE is minutes since the Unix epoch, times 10. The
        // final digit is reserved for the platform: 0 for phone/tablet and 1
        // for Android TV. Release builds pass VERSION_CODE_BASE from the
        // Makefile so both variants share the same base. Other builds fall
        // back to the current time so local/debug Gradle invocations continue
        // to work without extra arguments.
        versionCode computeVersionCode()
        versionName getVersionProperty("VERSION_LONG")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This setting, which defaults to 'true', will cause Tailscale to fall
        // back to the Google DNS servers if it cannot determine what the
        // operating system's DNS configuration is.
        //
        // Set it to false either here or in your local.properties file to
        // disable this behaviour.
        buildConfigField "boolean", "USE_GOOGLE_DNS_FALLBACK", getLocalProperty("tailscale.useGoogleDnsFallback", "true")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        warningsAsErrors true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "$compose_version"
    }
    flavorDimensions "version"
    namespace 'com.tailscale.ipn'

    buildTypes {
        applicationTest {
            initWith debug
            manifestPlaceholders.leanbackRequired = isTV()
            buildConfigField "String", "GITHUB_USERNAME", "\"" + getLocalProperty("githubUsername", "")+"\""
            buildConfigField "String", "GITHUB_PASSWORD", "\"" + getLocalProperty("githubPassword", "")+"\""
            buildConfigField "String", "GITHUB_2FA_SECRET", "\"" + getLocalProperty("github2FASecret", "")+"\""
        }
        debug {
            manifestPlaceholders.leanbackRequired = isTV()
        }
        release {
            manifestPlaceholders.leanbackRequired = isTV()

            minifyEnabled true

            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    testBuildType "applicationTest"
}

dependencies {
    // Android dependencies.
    implementation libs.androidx.core
    implementation libs.androidx.coreKtx
    implementation libs.androidx.browser
    implementation libs.androidx.security.crypto
    implementation libs.androidx.work.runtime
    implementation libs.androidx.work.runtimeKtx

    // Kotlin dependencies.
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.coroutines.core
    implementation libs.junit
    implementation libs.androidx.room.ktx
    runtimeOnly libs.kotlinx.coroutines.android
    implementation libs.kotlin.stdlib
    implementation libs.kotlin.reflect

    // Compose dependencies.
    def composeBom = platform(libs.androidx.compose.bom)
    implementation composeBom
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.activity.compose
    implementation libs.accompanist.permissions
    implementation libs.accompanist.systemuicontroller
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.compose.animation

    // Navigation dependencies.
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.navigation.ui

    // Supporting libraries.
    implementation libs.coil.compose
    implementation libs.zxing.core
    implementation libs.vico.compose
    implementation libs.vico.composeM3

    // Tailscale dependencies.
    implementation ':libtailscale@aar'

    // Integration Tests
    androidTestImplementation composeBom
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.ext.junitKtx
    androidTestImplementation libs.androidx.test.espresso.core
    implementation libs.androidx.test.uiautomator

    // Authentication only for tests
    androidTestImplementation libs.kotlin.onetimepassword
    androidTestImplementation libs.commons.codec

    // Unit Tests
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test

    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.ui.toolingPreview
}

def getLocalProperty(key, defaultValue) {
    try {
        Properties properties = new Properties()
        properties.load(project.file('local.properties').newDataInputStream())
        return properties.getProperty(key) ?: defaultValue
    } catch(Throwable ignored) {
        return defaultValue
    }
}


def getVersionProperty(key) {
    // tailscale.version is created / updated by the makefile, it is in a loosely
    // Makfile/envfile format, which is also loosely a properties file format.
    //      make tailscale.version
    def versionProps = new Properties()
    versionProps.load(project.file('../tailscale.version').newDataInputStream())
    return versionProps.getProperty(key).replaceAll('^"|"$', '')
}

def computeVersionCode() {
    def baseProperty = project.findProperty('VERSION_CODE_BASE')

    // Direct/local Gradle invocations may not come through the Makefile. Keep
    // those builds working by deriving a monotonic base from wall-clock time.
    def base = baseProperty != null
            ? baseProperty as long
            : (System.currentTimeMillis() / 60000L) * 10L

    // 0 for Android, 1 for Android TV. This keeps the two binaries distinguishable
    // in the Play Store while sharing a release base.
    def platform = isTV() ? 1 : 0

    return (base + platform) as int
}

def isTV() {
    return project.findProperty('PLATFORM')?.toString() == 'tv'
}
